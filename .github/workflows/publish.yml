name: Release

# Push-only on purpose. The changesets action is designed to run where
# github.ref is a real branch: it derives the version-PR base from
# context.ref and resets its release branch to context.sha. On PR events
# (pull_request or pull_request_target) those resolve to refs/pull/N/merge
# or the BASE commit respectively, so a PR-time version job either cannot
# see the PR's changesets or creates a PR with an invalid base (this failed
# on #58, #59, and #61 before this change). The publish job below already
# creates/updates the "Version Packages" PR whenever unreleased changesets
# land on main, and publishes once that PR is merged.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# id-token: write is required only for npm Trusted Publishing (OIDC).
# Configure the npm package's Trusted Publisher to this workflow path.

jobs:
  publish:
    name: Version packages / publish to npm
    runs-on: ubuntu-latest
    # A hung test step must produce a log, not burn the 6h GitHub timeout.
    timeout-minutes: 35
    env:
      HUSKY: "0"
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          # Node 24 includes npm >= 11, required for OIDC trusted publishing.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup runtime stubs for optional peer dependencies
        run: bun run setup-stubs

      - name: Build
        # Before tests: they import the built dist of workspace packages, and
        # `prepare` no longer builds on install (issue #169.4).
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        # Same command as ci.yml: per-package isolation. A root `bun test`
        # runs every test file in one process, letting a pi-spawn.test.ts
        # mock.module leak into dry-run.test.ts and hang the job (JS spin).
        run: bun run test

      - name: Integration tests
        # The release path must clear the same bar as PRs: inter-package
        # contracts are covered by the integration suite only.
        run: bun run test:integration

      - name: Type check tools
        run: bun run typecheck:tools

      - name: Test tools
        run: bun run test:tools

      - name: Validate Pi extension npm package
        run: bun run pack:pi

      # Last gate before publish: npm packs manifests as-is, so a
      # workspace: range would ship broken to the registry (0.12.0).
      - name: Check publishable manifests
        run: bun run check:publish-manifests

      - name: Publish packages to npm
        uses: changesets/action@v1
        with:
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
