name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # TEMPORARY (test-hang diagnosis): bound the job so a hung Test step
    # produces a log instead of burning the 6h GitHub timeout. Remove once
    # the hang is root-caused.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the changeset-coverage step diffs the PR against its
          # merge-base with main (three-dot diff).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check changeset coverage
        # Fails fast, before install/lint/test/build: a PR changing a
        # published package's src/ without a pending changeset declaring
        # it is rejected without paying for the rest of CI (prevents
        # merged-but-never-published runtime changes; happened on #71).
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:changesets

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        # TEMPORARY (test-hang diagnosis): bun's stdout is block-buffered when
        # piped, so the visible tail of a hung run may lag the real freeze
        # point. Run under a PTY (script) for unbuffered output, and dump
        # thread diagnostics from a watchdog WHILE bun is still alive (a
        # post-timeout dump is useless: SIGTERM has already killed the
        # process). Also print the runner's readdir order (find, unsorted).
        run: |
          echo "readdir order:"; find packages -name '*.test.ts' | sed 's/^/  /'
          ( while :; do sleep 30; echo "[heartbeat] bun test still running $(date -u +%H:%M:%SZ)"; done ) &
          wd=$!
          dump() {
            echo "=== alive-dump $1 $(date -u +%H:%M:%SZ) ==="
            ps auxww --forest || true
            for p in $(pgrep -f "bun test" || true); do
              echo "--- pid $p ---"
              tr '\0' ' ' < "/proc/$p/cmdline" 2>/dev/null; echo
              grep -E "State|Threads|VmRSS" "/proc/$p/status" 2>/dev/null || true
              echo "fds:"; ls -l "/proc/$p/fd" 2>/dev/null || true
              for t in /proc/$p/task/*; do
                echo "thread $(basename "$t"): wchan=$(cat "$t/wchan" 2>/dev/null || echo '?') $(grep State "$t/status" 2>/dev/null || true)"
              done
            done
          }
          ( sleep 90;  dump T90   ) &
          d90=$!
          ( sleep 300; dump T300 ) &
          d300=$!
          rc=0
          TERM=dumb script -qec "timeout 420 bun test" /dev/null || rc=$?
          kill $wd $d90 $d300 2>/dev/null || true
          if [ "$rc" = "124" ]; then
            echo "bun test TIMED OUT after 420s (unbuffered PTY output above shows the true freeze point)"
          fi
          exit $rc

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Validate Pi extension npm package
        run: bun run pack:pi

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Calibrated comparison: the run starts with a fixed pure-CPU kernel
    # (benchmarks/calibration.benchmark.ts) that measures how fast THIS runner
    # is today, and the comparison script scales its relative threshold and
    # absolute floor by that ratio (capped 3x). Shared-runner slowdowns of
    # 30–60% therefore cannot fake fleet-wide regressions, while genuine
    # algorithmic regressions still fail the job on any runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      # Runner timings are not comparable across machines, so the baseline is
      # the previous run of this job, restored from cache.
      # v2: re-baseline after 9eee0bf (inter-process persist lock) made the
      # persistence suite permanently slower than the pre-lock baseline.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-v2-${{ runner.os }}-

      - name: Run benchmarks
        run: bun run bench:ci

      - name: Detect performance regressions
        run: bun run bench:compare

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/benchmarks/benchmark-results.json
