name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # TEMPORARY (test-hang diagnosis): bound the job so a hung Test step
    # produces a log instead of burning the 6h GitHub timeout. Remove once
    # the hang is root-caused.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the changeset-coverage step diffs the PR against its
          # merge-base with main (three-dot diff).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check changeset coverage
        # Fails fast, before install/lint/test/build: a PR changing a
        # published package's src/ without a pending changeset declaring
        # it is rejected without paying for the rest of CI (prevents
        # merged-but-never-published runtime changes; happened on #71).
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:changesets

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        # TEMPORARY (test-hang diagnosis): the minimal faulty pair is
        # pi-spawn.test.ts + dry-run.test.ts — deterministic freeze on the
        # runner, passing locally (arm64 + amd64 docker, same bun). gdb
        # showed a pure userspace JS spin (main thread, no allocation, also
        # in LLInt with useJIT=0), and the CDP inspector cannot pause a
        # synchronous spin. So we run the pair with a preload watchdog that:
        #   - traces every child_process spawn/close (unbuffered, sync)
        #   - logs an afterEach hook per test (exact test position)
        #   - beats a heartbeat from a worker thread into /tmp/hb.log
        #     (immune to a main-thread event-loop hang -> proves the
        #     process is alive while the main thread is silent)
        # If the pair is still running after 75s (normal: ~2s), we dump the
        # last 150 log lines and fail with 99.
        run: |
          set +e
          PAIR="packages/pi-adapter/tests/pi-spawn.test.ts packages/core/tests/dry-run.test.ts"

          cat > /tmp/wd-preload.js <<'WD'
          const fs = require("node:fs");
          const log = (m) => { try { fs.writeSync(2, "[wd " + Date.now() + "] " + m + "\n"); } catch {} };
          log("preload up");
          try {
            const { afterEach } = require("bun:test");
            afterEach(() => { log("afterEach"); });
          } catch (e) { log("hook fail " + e); }
          try {
            const cp = require("node:child_process");
            const origSpawn = cp.spawn.bind(cp);
            cp.spawn = (...a) => {
              log("spawn " + a[0]);
              const c = origSpawn(...a);
              try { c.on("close", (code) => log("close " + a[0] + " code=" + code)); } catch {}
              return c;
            };
          } catch (e) { log("cp patch fail " + e); }
          try {
            const { Worker } = require("node:worker_threads");
            const w = new Worker(
              'const fs=require("node:fs");setInterval(()=>{try{fs.appendFileSync("/tmp/hb.log",Date.now()+" beat\\n")}catch{}},500);',
              { eval: true }
            );
            if (w.unref) w.unref();
          } catch (e) { log("worker fail " + e); }
          WD

          : > /tmp/hb.log
          echo "===== pair + watchdog preload: start $(date -u +%H:%M:%S) ====="
          TERM=dumb bun test --preload /tmp/wd-preload.js $PAIR >/tmp/pair.log 2>&1 &
          BPID=$!
          # /proc child watcher: ESM imports bypass the CJS spawn patch, so
          # trace child processes of the bun pid directly (appear/gone +
          # state). Catches git/pi spawned through any API.
          : > /tmp/children.log
          (
            SEEN="|"
            PREV=" "
            END=$((SECONDS + 80))
            while [ $SECONDS -lt $END ] && kill -0 $BPID 2>/dev/null; do
              CUR=" "
              for C in $(pgrep -P $BPID 2>/dev/null); do
                CUR="$CUR$C "
                case "$SEEN" in *"|$C|"*) ;; *)
                  SEEN="$SEEN$C|"
                  COMM=$(cat /proc/$C/comm 2>/dev/null)
                  ST=$(awk '{print $3}' /proc/$C/stat 2>/dev/null)
                  echo "$(date -u +%H:%M:%S.%3N) child pid=$C comm=$COMM state=$ST" >> /tmp/children.log
                ;; esac
              done
              for C in $PREV; do
                case "$CUR" in *" $C "*) ;; *)
                  echo "$(date -u +%H:%M:%S.%3N) gone pid=$C" >> /tmp/children.log
                ;; esac
              done
              PREV="$CUR"
              sleep 0.2
            done
          ) &
          WPID=$!
          DEADLINE=$((SECONDS + 75))
          while [ $SECONDS -lt $DEADLINE ] && kill -0 $BPID 2>/dev/null; do
            sleep 2
          done
          if kill -0 $BPID 2>/dev/null; then
            echo "===== FROZEN after ${SECONDS}s — last 150 lines of /tmp/pair.log:"
            tail -150 /tmp/pair.log
            echo "===== children trace (appear/gone):"
            cat /tmp/children.log
            echo "===== heartbeat tail (process still alive proof):"
            tail -3 /tmp/hb.log
            kill -9 $BPID 2>/dev/null
            wait $BPID 2>/dev/null
            exit 99
          fi
          wait $BPID; RC=$?
          wait $WPID 2>/dev/null
          echo "===== pair FINISHED rc=$RC after ${SECONDS}s — tail:"
          tail -40 /tmp/pair.log
          echo "===== children trace (appear/gone):"
          cat /tmp/children.log
          exit $RC

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Validate Pi extension npm package
        run: bun run pack:pi

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Calibrated comparison: the run starts with a fixed pure-CPU kernel
    # (benchmarks/calibration.benchmark.ts) that measures how fast THIS runner
    # is today, and the comparison script scales its relative threshold and
    # absolute floor by that ratio (capped 3x). Shared-runner slowdowns of
    # 30–60% therefore cannot fake fleet-wide regressions, while genuine
    # algorithmic regressions still fail the job on any runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      # Runner timings are not comparable across machines, so the baseline is
      # the previous run of this job, restored from cache.
      # v2: re-baseline after 9eee0bf (inter-process persist lock) made the
      # persistence suite permanently slower than the pre-lock baseline.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-v2-${{ runner.os }}-

      - name: Run benchmarks
        run: bun run bench:ci

      - name: Detect performance regressions
        run: bun run bench:compare

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/benchmarks/benchmark-results.json
