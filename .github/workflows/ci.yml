name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Validate Pi extension npm package
        run: bun run pack:pi

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Advisory on purpose: the suites measure sub-millisecond pure functions,
    # and shared-runner variance exceeds the 25% signal (observed +58%/+81%
    # between runs on code paths that had not changed). Results are still
    # published as an artifact and compared against the cached baseline with
    # a relative threshold plus an absolute noise floor; treat REGRESSION
    # lines as a prompt to investigate locally (`bun run bench`), not as a
    # merge blocker.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      # Runner timings are not comparable across machines, so the baseline is
      # the previous run of this job, restored from cache.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-${{ runner.os }}-

      - name: Run benchmarks
        run: bun run bench:ci

      - name: Detect performance regressions
        run: bun run bench:compare

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/benchmarks/benchmark-results.json
