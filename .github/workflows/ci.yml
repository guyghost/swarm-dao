name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # TEMPORARY (test-hang diagnosis): bound the job so a hung Test step
    # produces a log instead of burning the 6h GitHub timeout. Remove once
    # the hang is root-caused.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the changeset-coverage step diffs the PR against its
          # merge-base with main (three-dot diff).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check changeset coverage
        # Fails fast, before install/lint/test/build: a PR changing a
        # published package's src/ without a pending changeset declaring
        # it is rejected without paying for the rest of CI (prevents
        # merged-but-never-published runtime changes; happened on #71).
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:changesets

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        # TEMPORARY (test-hang diagnosis): the minimal faulty pair is
        # pi-spawn.test.ts + dry-run.test.ts — deterministic freeze on the
        # runner right after dry-run's last test (~1s in), passing locally
        # (docker arm64 AND amd64 emulation, same bun). Since it only
        # reproduces on the runner, this step captures forensics from the
        # frozen process ON the runner:
        #   run 1: revalidate the pair in foreground (timeout 25)
        #   run 2: background run; if frozen, gdb attach x3 backtrace
        #          samples + per-thread CPU ticks delta + kernel stack
        #   run 3: same with BUN_JSC_useJIT=0 to classify a JIT bug
        run: |
          set +e
          PAIR="packages/pi-adapter/tests/pi-spawn.test.ts packages/core/tests/dry-run.test.ts"

          sudo apt-get update -qq >/dev/null 2>&1
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq gdb >/dev/null 2>&1
          echo "gdb: $(command -v gdb || echo MISSING)"

          thread_ticks() {
            for T in /proc/$1/task/*; do
              awk '{printf "  tid=%s comm=%-16s state=%s utime=%s stime=%s\n", $1, $2, $3, $14, $15}' "$T/stat" 2>/dev/null
            done
          }

          capture_forensics() {
            BPID=$1
            echo ">>> FROZEN (pid $BPID) — forensics:"
            echo "--- wchan: $(sudo cat /proc/$BPID/wchan 2>/dev/null)"
            echo "--- kernel stack (main):"; sudo cat /proc/$BPID/stack 2>/dev/null || echo "  (unavailable)"
            grep -E 'Threads|voluntary_ctxt' /proc/$BPID/status 2>/dev/null || true
            echo "--- thread ticks sample A:"; thread_ticks "$BPID"
            sleep 2
            echo "--- thread ticks sample B (+2s; spinning thread's utime jumps):"; thread_ticks "$BPID"
            for s in 1 2 3; do
              echo "--- gdb backtrace sample $s:"
              sudo gdb -p "$BPID" -batch -ex "thread apply all bt 25" 2>&1 \
                | grep -vE 'Downloading|Missing separate|warning:|\[Thread|Reading symbols|no debugging' \
                | head -100
              sleep 2
            done
          }

          run_bg() {
            label=$1
            LOG=/tmp/bun-$label.log
            echo ""
            echo "===== $label: starting $(date -u +%H:%M:%S.%3NZ) ====="
            TERM=dumb bun test $PAIR >"$LOG" 2>&1 &
            BPID=$!
            frozen=0
            for i in $(seq 1 45); do
              kill -0 $BPID 2>/dev/null || break
              sleep 1
            done
            if kill -0 $BPID 2>/dev/null; then
              frozen=1
              echo "===== $label last log lines:"
              tail -15 "$LOG"
              capture_forensics "$BPID"
              sudo kill -9 $BPID 2>/dev/null
              wait $BPID 2>/dev/null
            else
              wait $BPID; rc=$?
              echo "===== $label FINISHED rc=$rc after ${i}s:"
              tail -5 "$LOG"
            fi
            echo ">>> $label frozen=$frozen <<<"
            return 0
          }

          echo "===== run 1: foreground revalidation ====="
          rc=0
          TERM=dumb timeout 25 bun test $PAIR || rc=$?
          echo "===== run 1 rc=$rc (124 = frozen) ====="

          run_bg pair
          export BUN_JSC_useJIT=0
          run_bg nojit
          unset BUN_JSC_useJIT
          exit 99

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Validate Pi extension npm package
        run: bun run pack:pi

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Calibrated comparison: the run starts with a fixed pure-CPU kernel
    # (benchmarks/calibration.benchmark.ts) that measures how fast THIS runner
    # is today, and the comparison script scales its relative threshold and
    # absolute floor by that ratio (capped 3x). Shared-runner slowdowns of
    # 30–60% therefore cannot fake fleet-wide regressions, while genuine
    # algorithmic regressions still fail the job on any runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      # Runner timings are not comparable across machines, so the baseline is
      # the previous run of this job, restored from cache.
      # v2: re-baseline after 9eee0bf (inter-process persist lock) made the
      # persistence suite permanently slower than the pre-lock baseline.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-v2-${{ runner.os }}-

      - name: Run benchmarks
        run: bun run bench:ci

      - name: Detect performance regressions
        run: bun run bench:compare

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/benchmarks/benchmark-results.json
