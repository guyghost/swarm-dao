name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # TEMPORARY (test-hang diagnosis): bound the job so a hung Test step
    # produces a log instead of burning the 6h GitHub timeout. Remove once
    # the hang is root-caused.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the changeset-coverage step diffs the PR against its
          # merge-base with main (three-dot diff).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check changeset coverage
        # Fails fast, before install/lint/test/build: a PR changing a
        # published package's src/ without a pending changeset declaring
        # it is rejected without paying for the rest of CI (prevents
        # merged-but-never-published runtime changes; happened on #71).
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:changesets

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        # TEMPORARY (test-hang diagnosis): the freeze happens at a constant
        # WALL-CLOCK point (~2.5s in, right after dry-run.test.ts) on 4/4
        # fresh runners, while bun spins at 100% CPU with zero allocation.
        # Discriminating experiments, each under its own timeout:
        #   A: full readdir order WITHOUT dry-run.test.ts  -> hang follows the
        #      file, or just the clock?
        #   B: only the first 10 files (dry-run included)  -> is the short
        #      sequence enough?
        #   C: only the first 9 files (no dry-run)         -> baseline.
        # The step fails if any experiment hangs, but runs them all first.
        run: |
          mapfile -t ALL < <(find packages -name '*.test.ts')
          echo "total files: ${#ALL[@]}"
          DRY=packages/core/tests/dry-run.test.ts
          di=-1
          for i in "${!ALL[@]}"; do [ "${ALL[$i]}" = "$DRY" ] && di=$i; done
          echo "dry-run index: $di"
          A=(); for f in "${ALL[@]}"; do [ "$f" != "$DRY" ] && A+=("$f"); done
          B=("${ALL[@]:0:di+1}")
          C=("${ALL[@]:0:di}")
          hang=0
          exp() {
            name=$1; shift
            echo ""
            echo "===== EXPERIMENT $name: $# files ====="
            printf '  %s\n' "$@"
            echo "===== begin $name $(date -u +%H:%M:%S.%3NZ) ====="
            rc=0
            TERM=dumb script -qec "timeout 150 bun test $*" /dev/null || rc=$?
            echo "===== end $name rc=$rc $(date -u +%H:%M:%S.%3NZ) ====="
            [ "$rc" = "124" ] && { echo ">>> $name HUNG <<<"; hang=1; }
          }
          exp B "${B[@]}"
          exp C "${C[@]}"
          exp A "${A[@]}"
          [ "$hang" = "0" ] || exit 99

      - name: Integration tests
        run: bun run test:integration

      - name: Build
        run: bun run build

      - name: Validate Pi extension npm package
        run: bun run pack:pi

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Calibrated comparison: the run starts with a fixed pure-CPU kernel
    # (benchmarks/calibration.benchmark.ts) that measures how fast THIS runner
    # is today, and the comparison script scales its relative threshold and
    # absolute floor by that ratio (capped 3x). Shared-runner slowdowns of
    # 30–60% therefore cannot fake fleet-wide regressions, while genuine
    # algorithmic regressions still fail the job on any runner.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      # Runner timings are not comparable across machines, so the baseline is
      # the previous run of this job, restored from cache.
      # v2: re-baseline after 9eee0bf (inter-process persist lock) made the
      # persistence suite permanently slower than the pre-lock baseline.
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-v2-${{ runner.os }}-

      - name: Run benchmarks
        run: bun run bench:ci

      - name: Detect performance regressions
        run: bun run bench:compare

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v2-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: packages/benchmarks/benchmark-results.json
