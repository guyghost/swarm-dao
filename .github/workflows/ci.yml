name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Weekly Sunday 06:15 UTC — real-runtime job (tmux + EVOLUTION_IT).
    - cron: "15 6 * * 0"

# One run per ref at a time: superseded pushes cancel their in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    # Permanent safety net, not a workaround: a hung Test step must produce a
    # log instead of burning the 6h GitHub timeout. The historical test hang
    # was root-caused (mock.module passthrough self-recursion, fixed in
    # packages/pi-adapter/tests/pi-spawn.test.ts) — the bound stays.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the changeset-coverage step diffs the PR against its
          # merge-base with main (three-dot diff).
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Check documentation links
        run: bun run check:doc-links

      - name: Cache Bun install
        # Keyed on the lockfile: cold installs only when dependencies change.
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Check changeset coverage
        # Fails fast, before install/lint/test/build: a PR changing a
        # published package's src/ without a pending changeset declaring
        # it is rejected without paying for the rest of CI (prevents
        # merged-but-never-published runtime changes; happened on #71).
        if: github.event_name == 'pull_request'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun run check:changesets

      # workspace: ranges in a public package's manifest would reach npm
      # unresolved (npm publish packs as-is) and break every install.
      - name: Check publishable manifests
        run: bun run check:publish-manifests

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Build
        # Explicit: `prepare` no longer builds on install (issue #169.4) —
        # tests import the built dist of workspace packages.
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        # Run per-package so each package's bun test process is isolated.
        # Historical note (root-caused): `bun test` at the workspace root runs
        # all test files in a single process, and bun's mock.module mutates
        # the live module registry for the whole run. pi-spawn.test.ts's
        # child_process passthrough used to re-read the namespace at call
        # time and recurse into itself for every non-`pi` command — an
        # infinite JS spin with no children spawned (fixed by value-capturing
        # the real spawn before mocking). Per-package execution stays the
        # standard anyway: module mocks are process-global in bun, so
        # isolation keeps suites order-independent by construction.
        run: bun run test

      - name: Integration tests
        run: bun run test:integration

      - name: Coverage gate
        # Single-process root run (safe since the mock.module passthrough
        # recursion fix) with dist excluded, then an explicit line/function
        # gate in scripts/check-coverage.ts (bun's own coverageThreshold
        # enforces metrics its lcov output does not report — see bunfig).
        run: bun run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Dependency audit
        # Bun has no `pm audit`. Install the OSV-Scanner binary and fail on
        # known vulns in bun.lock (Dependabot remains the weekly refresh path).
        run: |
          set -euo pipefail
          version=v2.2.1
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${version}/osv-scanner_linux_amd64" -o /tmp/osv-scanner
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan source -L bun.lock

      - name: Type check tools
        # tools/ holds the frozen-model contract validators and their tests;
        # they are not workspace packages, so they need their own gates
        # (issue #164).
        run: bun run typecheck:tools

      - name: Test tools
        run: bun run test:tools

      - name: Validate Pi extension npm package
        run: bun run pack:pi

  real-runtime:
    name: Real-runtime integration (opt-in)
    runs-on: ubuntu-latest
    # Nightly + label: keeps the default PR bar fast while still exercising
    # container sandbox / tmux paths that skip without binaries.
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'real-runtime'))
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Build
        run: bun run build

      - name: tmux host integration
        run: bun test packages/tmux-adapter/tests/integration.tmux.test.ts

      - name: Sandboxed evolution (EVOLUTION_IT)
        env:
          EVOLUTION_IT: "1"
        run: bun test packages/integration-tests/tests/sandbox-evolution.it.test.ts

  benchmarks:
    name: Performance benchmarks
    runs-on: ubuntu-latest
    # Calibrated comparison: the run starts with a fixed pure-CPU kernel
    # (benchmarks/calibration.benchmark.ts) that measures how fast THIS runner
    # is today, and the comparison script scales its relative threshold and
    # absolute floor by that ratio (capped 3x). Shared-runner slowdowns of
    # 30–60% therefore cannot fake fleet-wide regressions, while genuine
    # algorithmic regressions still fail the job on any runner.
    # Blocking (issue #169.1): the calibrated v2 baseline makes the job stable
    # enough to gate PRs — regression detection that can never fail is only
    # decoration.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up workspace links and optional peer stubs
        run: bun run setup-workspace

      - name: Build
        # Internal deps are workspace:* (issue #169.6) and `prepare` no longer
        # builds on install (issue #169.4): benchmarks import the local dist.
        run: bun run build

      # Runner timings are not comparable across machines, so the baseline is
      # the previous run of this job, restored from cache.
      # v3: re-baseline after the audit fsync (file + directory) before the
      # state.json rename made file persist permanently slower than v2.
      # v2: re-baseline after 9eee0bf (inter-process persist lock).
      - name: Restore benchmark baseline
        uses: actions/cache/restore@v6
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v3-${{ runner.os }}-${{ github.sha }}
          restore-keys: benchmark-baseline-v3-${{ runner.os }}-

      - name: Run benchmarks
        run: bun run bench:ci

      - name: Detect performance regressions
        run: bun run bench:compare

      - name: Save benchmark baseline
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: packages/benchmarks/benchmark-baseline.json
          key: benchmark-baseline-v3-${{ runner.os }}-${{ github.sha }}

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: packages/benchmarks/benchmark-results.json
